name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forecasthub_test
          POSTGRES_USER: forecasthub
          POSTGRES_PASSWORD: forecasthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecasthub -d forecasthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://forecasthub:forecasthub@localhost:5432/forecasthub_test?schema=public
      DATABASE_URL: postgresql://forecasthub:forecasthub@localhost:5432/forecasthub_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm audit --audit-level=critical --omit=dev
      - run: npm run prisma:generate --workspace=@forecasthub/api
      - run: npm exec --workspace=@forecasthub/api -- prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspace=@forecasthub/shared
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forecasthub_e2e_test
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d forecasthub_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5432/forecasthub_e2e_test?schema=public
      DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5432/forecasthub_e2e_test?schema=public
      API_URL: http://127.0.0.1:43017
      NEXT_PUBLIC_API_URL: http://127.0.0.1:43017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:generate
      - run: npm exec --workspace=@forecasthub/api -- prisma migrate deploy
      - run: npm run build
      - name: Ensure Playwright ports are free
        run: |
          for port in 43017 43018; do
            pids="$(lsof -ti :"$port" || true)"
            if [ -n "$pids" ]; then
              kill $pids || true
            fi
          done
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: warn

  deploy-web:
    name: Deploy web to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, e2e]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global vercel@65.12.1
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Vercel deployment
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy prebuilt Vercel output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, e2e]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
