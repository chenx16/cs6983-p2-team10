services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forecasthub
      POSTGRES_USER: forecasthub
      POSTGRES_PASSWORD: forecasthub
    ports:
      - "5432:5432"
    volumes:
      - forecasthub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecasthub -d forecasthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forecasthub-postgres:
